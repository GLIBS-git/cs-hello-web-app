opencollection: 1.0.0

info:
  name: GlibsTest
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: url
      value: http://127.0.0.1:5050
    - name: url
      value: http://localhost:5050
      disabled: true
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
